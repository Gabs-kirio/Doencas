<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Projeto Doenças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="capa">
    <h1>Projeto Doenças</h1>

    <div class="conteudo-capa">
        <img src="sua-foto.jpg">
        <p>
            Este site apresenta doenças, suas causas, sintomas, prevenção e tratamento.
        </p>
    </div>
</header>

<section class="controle">

    <div class="botoes-principais">
        <button onclick="mostrarCategoria('infecciosas')">Infecciosas</button>
        <button onclick="mostrarCategoria('nao')">Não Infecciosas</button>
    </div>

    <input type="text" id="pesquisa" placeholder="Pesquisar doença..." oninput="filtrar()">

    <select id="filtro" onchange="filtrar()">
        <option value="">Filtrar por categoria</option>
        <option value="virose">Virose</option>
        <option value="bacteriose">Bacteriose</option>
        <option value="metabolica">Metabólica</option>
        <option value="cardiovascular">Cardiovascular</option>
    </select>

    <div id="lista-doencas"></div>

</section>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-conteudo">
        <span onclick="fecharModal()" class="fechar">&times;</span>
        <h2 id="titulo"></h2>
        <p id="descricao"></p>
    </div>
</div>

<footer>
    <p>(00) 00000-0000</p>
    <p>exemplo@email.com</p>
    <p>"Enquanto herdarmos a ciência, a humanidade nunca morrerá"</p>
</footer>

<script src="script.js"></script>
</body>
</html>
